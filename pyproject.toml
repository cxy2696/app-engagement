[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engagegraph"
version = "2.3.1"
description = "Temporal next-item recommendation with a reproducible app-engagement benchmark, reference baselines, and a deployable API."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Xinyi Cui", email = "xc535@cornell.edu" },
]
maintainers = [
  { name = "Xinyi Cui", email = "xc535@cornell.edu" },
]
keywords = [
  "recommender-systems",
  "app-engagement",
  "metapath2vec",
  "graph-representation-learning",
  "collaborative-filtering",
  "reproducibility",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3.1",
  "pyarrow>=14",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pydantic>=2.5,<3",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "httpx>=0.26",
]

[project.optional-dependencies]
als = ["implicit>=0.7.2"]
graph = ["torch>=2.2", "torch-geometric>=2.5"]
plots = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.9",
  "build>=1.2",
]
all = [
  "implicit>=0.7.2",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "matplotlib>=3.8",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.9",
  "build>=1.2",
]

[project.scripts]
engagegraph = "engagegraph.cli:main"

[project.urls]
Homepage = "https://github.com/cxy2696/app-engagement"
Documentation = "https://github.com/cxy2696/app-engagement/tree/main/docs"
Repository = "https://github.com/cxy2696/app-engagement"
Issues = "https://github.com/cxy2696/app-engagement/issues"
Changelog = "https://github.com/cxy2696/app-engagement/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engagegraph = ["api/static/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "graph: tests that require torch and torch-geometric",
  "slow: long-running integration tests",
]
filterwarnings = [
  "error::FutureWarning:engagegraph.*",
]

[tool.coverage.run]
source = ["engagegraph"]
branch = true
omit = ["*/api/static/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
packages = ["engagegraph"]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
